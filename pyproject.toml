[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morde-rsi"
version = "0.1.0"
description = "Morde RSI: independent loop that fixes Morde bugs with a separate deterministic verifier. RRSI-shaped skeleton, DSH Task as fixer."
requires-python = ">=3.10"
license = "Apache-2.0"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
